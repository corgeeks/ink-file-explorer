name: Pull Request Validation

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run type check
        run: bun run build

      - name: Run tests with coverage
        run: bun test --coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Check package can be built
        run: npm pack --dry-run

      - name: Bundle size check
        run: |
          BUNDLE_SIZE=$(stat -c%s "dist/index.js" 2>/dev/null || stat -f%z "dist/index.js" 2>/dev/null || echo "0")
          MAX_SIZE=$((100 * 1024))  # 100KB limit
          echo "Bundle size: $BUNDLE_SIZE bytes"
          echo "Max allowed: $MAX_SIZE bytes"
          if [ "$BUNDLE_SIZE" -gt "$MAX_SIZE" ]; then
            echo "❌ Bundle size exceeds limit!"
            exit 1
          else
            echo "✅ Bundle size is within limit"
          fi

      - name: Validate package.json
        run: |
          # Check required fields exist
          bun -e "
            const pkg = require('./package.json');
            const required = ['name', 'version', 'main', 'types', 'exports'];
            const missing = required.filter(f => !pkg[f]);
            if (missing.length) {
              console.error('Missing required fields:', missing);
              process.exit(1);
            }
            console.log('✅ package.json is valid');
          "
