name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write
  packages: write

jobs:
  publish-beta:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate beta version
        id: beta-version
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TIMESTAMP=$(date -u '+%Y.%m.%d.%H.%M.%S')
          BETA_VERSION="${PACKAGE_VERSION}-beta.${TIMESTAMP}"
          echo "version=${BETA_VERSION}" >> $GITHUB_OUTPUT
          echo "Beta version: ${BETA_VERSION}"

      - name: Update package.json for beta
        run: |
          # Update version
          npm version ${{ steps.beta-version.outputs.version }} --no-git-tag-version

          # Update publishConfig to point to GitHub Package Registry
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.publishConfig = {
              access: 'public',
              registry: 'https://npm.pkg.github.com',
              tag: 'main'
            };
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Setup .npmrc for GitHub Package Registry
        run: |
          echo "@corgeeks:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc

      - name: Build package
        run: bun run build

      - name: Run tests
        run: bun test

      - name: Publish to GitHub Package Registry
        run: npm publish --tag main
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: node
          package-name: '@corgeeks/ink-file-explorer'
          bump-minor-pre-major: true
          bump-patch-for-minor-pre-major: true

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build package
        run: bun run build

      - name: Run tests
        run: bun test

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release Asset
        run: |
          npm pack
          PACKAGE_FILE=$(ls *.tgz)
          gh release upload ${{ needs.release-please.outputs.tag_name }} "$PACKAGE_FILE"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
