name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run type check and build
        run: bun run build

      - name: Run tests with coverage
        run: bun test --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Test package installation
        run: |
          # Pack the package
          npm pack

          # Create test directory
          mkdir -p /tmp/test-install
          cd /tmp/test-install

          # Initialize test project
          bun init -y

          # Install the packed package
          PACKAGE=$(ls $GITHUB_WORKSPACE/*.tgz | head -n1)
          bun add "file:$PACKAGE"

          # Test that it can be imported
          bun -e "
            const { InkFileExplorer } = require('@corgeeks/ink-file-explorer');
            if (!InkFileExplorer) {
              console.error('Failed to import InkFileExplorer');
              process.exit(1);
            }
            console.log('✅ Package imports successfully');
          "

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check for untrusted dependencies
        run: bun pm untrusted || true

      - name: Check for known vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'
