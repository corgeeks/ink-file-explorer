# .github/workflows/ensure-labels.yml
name: Ensure labels
on:
  push:
    branches: [main]
jobs:
  ensure:
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          gh label create automated    -c BFD4F2 -d "PRs opened by automation" || true
          gh label create dependencies -c 0366d6 -d "Dependency updates"       || true
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}