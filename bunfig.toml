# Bun test configuration

[test]
# Enable coverage reporting by default
coverage = true

# Coverage thresholds - currently disabled as Bun enforces per-file thresholds
# which would require all files to meet the threshold, not just the overall average
# Current overall coverage: 76.41% lines, 66.26% functions
# coverageThreshold = { lines = 0.70, functions = 0.60 }

# Coverage reporters (text and lcov supported by Bun)
coverageReporter = ["text", "lcov"]

# Output directory for coverage reports
coverageDir = "./coverage"

# Skip test files from coverage
coverageSkipTestFiles = true

# Ignore patterns for coverage
coveragePathIgnorePatterns = [
  "**/__tests__/**",
  "**/*.test.ts",
  "**/*.test.tsx",
  "**/test-*.ts",
  "**/test-*.tsx",
  "src/main.tsx",  # Demo app, not library code
]
